
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0c0c0c">
<title>Movium — Discover Movies</title>
<style>
:root {
  --bg: #0c0c0c;
  --panel: #151515;
  --border: #262626;
  --text: #f5f5f5;
  --muted: #929292;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
  -webkit-font-smoothing: antialiased;
}

button, input { font: inherit; }
button { cursor: pointer; }

.container {
  width: min(1400px, calc(100% - 64px));
  margin: auto;
}

header {
  height: 74px;
  border-bottom: 1px solid #202020;
  position: relative;
  z-index: 2;
}

.nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 100%;
}

.logo {
  color: white;
  font-size: 27px;
  font-weight: 750;
  letter-spacing: -1.5px;
  text-decoration: none;
}

.logo span { color: #858585; }

.nav-links {
  display: flex;
  gap: 30px;
  align-items: center;
}

.nav-links a {
  color: #a3a3a3;
  text-decoration: none;
  font-size: 13px;
}

.nav-links a:hover { color: white; }

.search-icon {
  border: 0;
  background: transparent;
  color: white;
  font-size: 21px;
}

main { padding-bottom: 70px; }

/* Featured cinematic banner */

.hero {
  height: clamp(340px, 43vw, 560px);
  position: relative;
  display: flex;
  align-items: flex-end;
  overflow: hidden;
  isolation: isolate;
  margin-bottom: 43px;
}

.hero-backdrop {
  position: absolute;
  inset: 0;
  z-index: -2;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 35%;
  opacity: .83;
}

.hero::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  background:
    linear-gradient(to right, var(--bg) 0%, rgba(12,12,12,.88) 8%, rgba(12,12,12,.35) 42%, transparent 76%),
    linear-gradient(to left, var(--bg) 0%, transparent 25%),
    linear-gradient(to top, var(--bg) 0%, rgba(12,12,12,.15) 35%, transparent 75%);
}

.hero-content {
  padding: 0 0 47px 4px;
  max-width: 560px;
}

.eyebrow {
  font-size: 11px;
  font-weight: 700;
  color: #c0c0c0;
  letter-spacing: 2.3px;
  margin-bottom: 15px;
}

.hero h1 {
  margin: 0;
  font-size: clamp(36px, 5vw, 65px);
  line-height: 1.02;
  letter-spacing: -2.5px;
  font-weight: 750;
}

.hero-meta {
  color: #d0d0d0;
  font-size: 14px;
  margin-top: 15px;
}

.hero-description {
  color: #c1c1c1;
  font-size: 14px;
  line-height: 1.7;
  max-width: 420px;
  margin: 15px 0 23px;
}

.hero-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}

.play-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 13px 20px;
  background: white;
  color: #111;
  border: 1px solid white;
  border-radius: 5px;
  font-size: 13px;
  font-weight: 700;
}

.play-button:hover { background: #dedede; }

.secondary-button {
  padding: 13px 17px;
  background: rgba(20,20,20,.65);
  color: white;
  border: 1px solid #555;
  border-radius: 5px;
  font-size: 13px;
}

.secondary-button:hover { background: #292929; }

.content-section { margin-top: 42px; }

.section-heading {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 15px;
  margin-bottom: 20px;
}

.section-heading h2 {
  font-size: 21px;
  letter-spacing: -.5px;
  margin: 0;
  font-weight: 650;
}

.section-description {
  margin: 7px 0 0;
  color: var(--muted);
  font-size: 13px;
}

.count {
  color: var(--muted);
  font-size: 12px;
  white-space: nowrap;
}

/* Actual portrait poster cards */

.movie-grid {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 28px 17px;
}

.featured-grid {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 17px;
}

.movie {
  min-width: 0;
  cursor: pointer;
}

.poster-wrap {
  position: relative;
  aspect-ratio: 2 / 3;
  overflow: hidden;
  background: #171717;
  border: 1px solid #252525;
  border-radius: 4px;
}

.poster {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform .22s ease, opacity .22s ease;
}

.movie:hover .poster {
  transform: scale(1.035);
  opacity: .85;
}

.movie-title {
  color: #f2f2f2;
  font-size: 13px;
  font-weight: 600;
  line-height: 1.5;
  margin-top: 10px;
  overflow-wrap: anywhere;
}

.movie-year {
  color: var(--muted);
  font-size: 12px;
  margin-top: 4px;
}

.alphabet {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 24px;
}

.letter {
  min-width: 32px;
  height: 32px;
  padding: 0 9px;
  border: 1px solid #292929;
  border-radius: 4px;
  background: #141414;
  color: #aaa;
  font-size: 12px;
}

.letter:hover, .letter.active {
  color: #fff;
  background: #303030;
  border-color: #555;
}

.search-panel {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 25px;
}

.search-box {
  display: flex;
  align-items: center;
  gap: 12px;
  flex: 1;
  max-width: 480px;
  height: 44px;
  padding: 0 14px;
  border: 1px solid #303030;
  background: #141414;
  border-radius: 5px;
}

.search-box span { color: #888; font-size: 18px; }

#search {
  flex: 1;
  min-width: 0;
  height: 100%;
  border: 0;
  outline: none;
  background: transparent;
  color: white;
  font-size: 13px;
}

#search::placeholder { color: #777; }

.random-button {
  height: 44px;
  padding: 0 15px;
  border: 1px solid #383838;
  border-radius: 5px;
  background: #191919;
  color: white;
  font-size: 12px;
}

.random-button:hover { background: #292929; }

.empty {
  grid-column: 1 / -1;
  padding: 50px 0;
  text-align: center;
  color: var(--muted);
  font-size: 14px;
}

footer {
  border-top: 1px solid #222;
  padding: 25px 0;
  color: #777;
  font-size: 12px;
}

/* Movie information dialog */

.modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 10;
  padding: 20px;
  background: rgba(0,0,0,.85);
  place-items: center;
}

.modal.open { display: grid; }

.modal-card {
  display: flex;
  gap: 22px;
  position: relative;
  width: min(500px, 100%);
  padding: 22px;
  border: 1px solid #333;
  border-radius: 7px;
  background: #141414;
}

.modal-poster {
  width: 42%;
  max-height: 330px;
  object-fit: cover;
  border-radius: 3px;
}

.modal-info { padding-top: 25px; }
.modal-info h2 { font-size: 23px; line-height: 1.3; }
.modal-info p { color: #999; font-size: 13px; }

.close {
  position: absolute;
  top: 9px;
  right: 12px;
  color: white;
  background: transparent;
  border: 0;
  font-size: 23px;
}

@media (max-width: 1000px) {
  .movie-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .featured-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .container { width: calc(100% - 40px); }
}

@media (max-width: 600px) {
  header { height: 62px; }
  .container { width: calc(100% - 28px); }
  .nav-links { gap: 13px; }
  .nav-links a { font-size: 11px; }
  .nav-label { display: none; }
  .logo { font-size: 24px; }
  .hero { height: 420px; margin-bottom: 34px; }
  .hero-content { padding-bottom: 30px; }
  .hero h1 { font-size: 39px; letter-spacing: -1.4px; }
  .hero-description { font-size: 13px; }
  .hero::before {
    background:
      linear-gradient(to right, rgba(12,12,12,.5), transparent),
      linear-gradient(to top, var(--bg) 0%, rgba(12,12,12,.45) 55%, transparent 100%);
  }
  .movie-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px 11px; }
  .featured-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 13px; }
  .movie-title { font-size: 12px; }
  .section-heading h2 { font-size: 19px; }
  .search-panel { flex-wrap: wrap; }
  .search-box { max-width: none; flex-basis: 100%; }
  .random-button { width: 100%; }
  .content-section { margin-top: 34px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; }
}
</style>
</head>
<body>

<header>
  <div class="container nav">
    <a href="#" class="logo">movium<span>.</span></a>
    <nav class="nav-links">
      <a href="#featured">Featured</a>
      <a href="#library">Movies</a>
      <button class="search-icon" id="focusSearch" aria-label="Search">⌕</button>
    </nav>
  </div>
</header>

<main>
  <section class="container hero" id="hero">
    <img class="hero-backdrop" id="heroBackdrop" alt="">
    <div class="hero-content">

      <h1 id="heroTitle">Interstellar</h1>

      <p class="hero-description" id="heroDescription">
        A journey beyond the stars, to the edge of what humanity knows.
      </p>
      <div class="hero-actions">
        <button class="play-button" id="playTrailer">▶ Play trailer</button>
        <button class="secondary-button" id="heroDetails">More info</button>
      </div>
    </div>
  </section>

  <div class="container">
    <section class="content-section" id="featured">
      <div class="section-heading">
        <div>
          <h2>Featured films</h2>
          <p class="section-description">A selection worth your time.</p>
        </div>
      </div>
      <div class="featured-grid" id="featuredGrid"></div>
    </section>

    <section class="content-section" id="library">
      <div class="section-heading">
        <div>
          <h2 id="libraryTitle">Explore movies</h2>
          <p class="section-description">Find something to watch.</p>
        </div>
        <span class="count" id="resultsCount"></span>
      </div>

      <div class="search-panel">
        <label class="search-box">
          <span>⌕</span>
          <input id="search" type="search"
            placeholder="Search by movie title..."
            autocomplete="off">
        </label>
        <button class="random-button" id="randomButton">↗ Pick a random movie</button>
      </div>

      <div class="alphabet" id="alphabet"></div>
      <div class="movie-grid" id="movieGrid"></div>
    </section>
  </div>
</main>

<footer>
  <div class="container">movium. <span>· A library for movie lovers.</span></div>
</footer>

<div class="modal" id="movieModal" role="dialog" aria-modal="true">
  <div class="modal-card">
    <button class="close" id="closeModal" aria-label="Close">×</button>
    <img class="modal-poster" id="modalPoster" alt="">
    <div class="modal-info">
      <h2 id="modalTitle"></h2>
      <p id="modalYear"></p>
      <button class="play-button" id="modalTrailer">▶ Play trailer</button>
    </div>
  </div>
</div>

  { title:"Zootopia", year:2016, poster:"hlK0e0wAQ3VLuJcsfIYPvb4JVud.jpg", backdrop:"mhdeE1yShHTaDbJVdWyTlzFvNkr.jpg", id:269149 }
];

const featuredTitles = [
  "Interstellar", "The Batman", "Oppenheimer",
  "Inception", "Spider-Man: No Way Home"
];

const letters = ["All", ..."ABCDEFGHIJKLMNOPQRSTUVWXYZ"];
const $ = id => document.getElementById(id);
let selectedLetter = "All";
let currentMovie = null;

function posterURL(movie) {
  return movie.poster ? IMAGE + POSTER_SIZE + movie.poster : "";
}

function backdropURL(movie) {
  return movie.backdrop ? IMAGE + BACKDROP_SIZE + movie.backdrop : "";
}

function makeCard(movie) {
  const card = document.createElement("article");
  card.className = "movie";
  card.tabIndex = 0;

  const wrap = document.createElement("div");
  wrap.className = "poster-wrap";

  const img = document.createElement("img");
  img.className = "poster";
  img.src = posterURL(movie);
  img.alt = movie.title + " poster";
  img.loading = "lazy";
  img.onerror = () => {
    img.onerror = null;
    img.src = "https://placehold.co/500x750/171717/aaaaaa?text=Poster+Unavailable";
  };

  const title = document.createElement("div");
  title.className = "movie-title";
  title.textContent = movie.title;

  const year = document.createElement("div");
  year.className = "movie-year";
  year.textContent = movie.year;

  wrap.appendChild(img);
  card.append(wrap, title, year);
  card.addEventListener("click", () => openMovie(movie));
  card.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      openMovie(movie);
    }
  });
  return card;
}

function renderFeatured() {
  $("featuredGrid").replaceChildren();
  featuredTitles.forEach(title => {
    const movie = movies.find(m => m.title === title);
    if (movie) $("featuredGrid").appendChild(makeCard(movie));
  });
}

function renderAlphabet() {
  $("alphabet").replaceChildren();
  letters.forEach(letter => {
    const button = document.createElement("button");
    button.className = "letter" + (selectedLetter === letter ? " active" : "");
    button.textContent = letter;
    button.setAttribute("aria-pressed", selectedLetter === letter);
    button.addEventListener("click", () => {
      selectedLetter = letter;
      renderAlphabet();
      renderMovies();
    });
    $("alphabet").appendChild(button);
  });
}

function renderMovies() {
  const query = $("search").value.trim().toLowerCase();
  const filtered = movies
    .filter(m => m.title.toLowerCase().includes(query))
    .filter(m => selectedLetter === "All" ||
      m.title.toUpperCase().startsWith(selectedLetter))
    .sort((a, b) => a.title.localeCompare(b.title));

  $("movieGrid").replaceChildren();
  $("libraryTitle").textContent = query ? "Search results" :
    selectedLetter === "All" ? "Explore movies" :
    `Movies starting with ${selectedLetter}`;
  $("resultsCount").textContent = `${filtered.length} movies`;

  if (!filtered.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "No movies found. Try another search.";
    $("movieGrid").appendChild(empty);
    return;
  }

  filtered.forEach(movie => $("movieGrid").appendChild(makeCard(movie)));
}

function setHero(movie) {
  $("heroTitle").textContent = movie.title;
  $("heroMeta").textContent = `${movie.year} · Featured film`;
  $("heroDescription").textContent = movie.description ||
    `Discover ${movie.title}, released in ${movie.year}. Explore the film on Movium.`;

  const backdrop = $("heroBackdrop");
  backdrop.src = backdropURL(movie);
  backdrop.alt = "";

  backdrop.onerror = () => {
    backdrop.onerror = null;
    backdrop.style.display = "none";
  };

  backdrop.style.display = "";
  currentMovie = movie;
}

function openMovie(movie) {
  currentMovie = movie;
  $("modalPoster").src = posterURL(movie);
  $("modalPoster").alt = movie.title + " poster";
  $("modalTitle").textContent = movie.title;
  $("modalYear").textContent = `Released in ${movie.year}`;
  $("movieModal").classList.add("open");
}

function closeMovie() {
  $("movieModal").classList.remove("open");
}

function playTrailer(movie) {
  if (movie && movie.id) {
    window.open(
      `https://www.youtube.com/results?search_query=${encodeURIComponent(movie.title + " " + movie.year + " official trailer")}`,
      "_blank", "noopener,noreferrer"
    );
  }
}

$("search").addEventListener("input", () => {
  selectedLetter = "All";
  renderAlphabet();
  renderMovies();
});

$("randomButton").addEventListener("click", () => {
  const query = $("search").value.trim().toLowerCase();
  const candidates = movies.filter(m =>
    m.title.toLowerCase().includes(query) &&
    (selectedLetter === "All" ||
      m.title.toUpperCase().startsWith(selectedLetter))
  );

  if (!candidates.length) return;
  openMovie(candidates[Math.floor(Math.random() * candidates.length)]);
});

$("focusSearch").addEventListener("click", () => {
  $("search").focus();
  $("library").scrollIntoView({ behavior: "smooth" });
});

$("playTrailer").addEventListener("click", () => playTrailer(currentMovie));
$("heroDetails").addEventListener("click", () => openMovie(currentMovie));
$("modalTrailer").addEventListener("click", () => playTrailer(currentMovie));
$("closeModal").addEventListener("click", closeMovie);

$("movieModal").addEventListener("click", e => {
  if (e.target === $("movieModal")) closeMovie();
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeMovie();
});

renderAlphabet();
renderFeatured();
renderMovies();
setHero(movies.find(m => m.title === "Interstellar"));
</script>
</body>
</html>
