
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0c0c0c">
<title>Movium — Movie Library</title>

<style>
:root {
  --bg: #0c0c0c;
  --panel: #151515;
  --border: #282828;
  --white: #f5f5f5;
  --gray: #929292;
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--white);
  font-family: Arial, Helvetica, sans-serif;
  -webkit-font-smoothing: antialiased;
}

body.overlay-active { overflow: hidden; }

button, input { font: inherit; }
button { cursor: pointer; }

.container {
  width: min(1400px, calc(100% - 64px));
  margin: auto;
}

header {
  height: 72px;
  border-bottom: 1px solid #222;
}

.nav {
  display: flex;
  height: 100%;
  align-items: center;
  justify-content: space-between;
}

.logo {
  color: white;
  font-size: 27px;
  font-weight: 750;
  letter-spacing: -1.5px;
  text-decoration: none;
}

.logo span { color: #888; }

.nav-links {
  display: flex;
  gap: 27px;
  align-items: center;
}

.nav-links a {
  color: #aaa;
  font-size: 13px;
  text-decoration: none;
}

.nav-links a:hover { color: white; }

main { padding-bottom: 65px; }

/* Featured movie */

.hero {
  height: clamp(350px, 43vw, 550px);
  position: relative;
  isolation: isolate;
  display: flex;
  align-items: flex-end;
  overflow: hidden;
  margin-bottom: 42px;
}

.hero-backdrop {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 35%;
  z-index: -2;
  background: #111;
}

.hero::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  background:
    linear-gradient(to right, #0c0c0c 0%, rgba(12,12,12,.85) 10%, rgba(12,12,12,.24) 55%, transparent 85%),
    linear-gradient(to left, #0c0c0c 0%, transparent 28%),
    linear-gradient(to top, #0c0c0c 0%, rgba(12,12,12,.22) 40%, transparent 90%);
}

.hero-content {
  max-width: 550px;
  padding: 0 0 48px 4px;
}

.eyebrow {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 2.3px;
  color: #bbb;
  margin-bottom: 15px;
}

.hero h1 {
  font-size: clamp(38px, 5vw, 65px);
  letter-spacing: -2px;
  line-height: 1.03;
  margin: 0;
}

.hero-meta {
  margin-top: 14px;
  color: #ccc;
  font-size: 13px;
}

.hero-description {
  max-width: 410px;
  margin: 15px 0 23px;
  color: #bbb;
  font-size: 14px;
  line-height: 1.7;
}

.hero-actions { display: flex; gap: 10px; }

.play-button, .secondary-button {
  border-radius: 5px;
  padding: 13px 18px;
  font-size: 13px;
  font-weight: 600;
}

.play-button {
  color: #111;
  background: white;
  border: 1px solid white;
}

.play-button:hover { background: #ddd; }

.secondary-button {
  background: #191919;
  border: 1px solid #444;
  color: white;
}

/* Search */

.search-panel {
  display: flex;
  gap: 10px;
  margin-bottom: 25px;
}

.search-box {
  display: flex;
  align-items: center;
  gap: 11px;
  flex: 1;
  max-width: 500px;
  height: 44px;
  padding: 0 13px;
  border: 1px solid #303030;
  border-radius: 5px;
  background: #141414;
}

.search-symbol {
  color: #888;
  font-size: 20px;
}

#search {
  width: 100%;
  min-width: 0;
  height: 100%;
  color: white;
  background: transparent;
  outline: none;
  border: none;
  font-size: 13px;
}

#search::placeholder { color: #777; }

.random-button {
  height: 44px;
  padding: 0 15px;
  color: white;
  background: #191919;
  border: 1px solid #383838;
  border-radius: 5px;
  font-size: 12px;
}

.random-button:hover { background: #292929; }

/* Sections and posters */

.section { margin-top: 42px; }

.section-heading {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  margin-bottom: 19px;
  gap: 15px;
}

.section-heading h2 {
  margin: 0;
  font-size: 21px;
  letter-spacing: -.5px;
}

.section-description {
  margin: 7px 0 0;
  font-size: 13px;
  color: var(--gray);
}

.count {
  font-size: 12px;
  color: var(--gray);
  white-space: nowrap;
}

.featured-grid {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 17px;
}

.movie-grid {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 27px 17px;
}

.movie {
  min-width: 0;
  cursor: pointer;
  outline-offset: 4px;
}

.poster-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 2 / 3;
  overflow: hidden;
  background: #181818;
  border: 1px solid #282828;
  border-radius: 4px;
}

.poster {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform .2s ease, opacity .2s ease;
}

.movie:hover .poster {
  transform: scale(1.035);
  opacity: .85;
}

.movie-title {
  margin-top: 10px;
  color: #f2f2f2;
  font-size: 13px;
  font-weight: 600;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.movie-year {
  margin-top: 4px;
  color: #929292;
  font-size: 12px;
}

.alphabet {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 24px;
}

.letter {
  min-width: 32px;
  height: 32px;
  padding: 0 8px;
  color: #aaa;
  background: #151515;
  border: 1px solid #292929;
  border-radius: 4px;
  font-size: 12px;
}

.letter:hover, .letter.active {
  color: white;
  background: #303030;
  border-color: #555;
}

.empty {
  grid-column: 1 / -1;
  padding: 45px 0;
  color: #929292;
  text-align: center;
  font-size: 14px;
}

footer {
  padding: 25px 0;
  border-top: 1px solid #222;
  color: #777;
  font-size: 12px;
}

/* Movie popup: fades into near-black */

.movie-overlay {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: rgb(1, 1, 1);
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity 250ms ease, visibility 250ms ease;
}

.movie-overlay.open {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
}

.overlay-close {
  position: absolute;
  top: 23px;
  right: 28px;
  width: 42px;
  height: 42px;
  border: 0;
  background: transparent;
  color: white;
  font-size: 30px;
  font-weight: 300;
}

.drive-popup {
  width: min(410px, 100%);
  text-align: center;
}

.drive-label {
  color: #777;
  font-size: 10px;
  letter-spacing: 2px;
}

.drive-popup h2 {
  margin: 18px 0 7px;
  color: white;
  font-size: 25px;
  letter-spacing: -.5px;
}

.drive-year {
  color: #858585;
  font-size: 13px;
  margin-bottom: 25px;
}

.drive-link {
  display: inline-block;
  padding: 13px 20px;
  border-radius: 4px;
  background: #f2f2f2;
  color: #111;
  text-decoration: none;
  font-size: 13px;
  font-weight: 650;
}

.drive-link:hover { background: #ccc; }

.drive-unavailable {
  color: #777;
  font-size: 13px;
  padding: 13px 0;
}

@media (max-width: 1000px) {
  .movie-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .container { width: calc(100% - 40px); }
}

@media (max-width: 600px) {
  header { height: 62px; }
  .container { width: calc(100% - 28px); }
  .nav-links { gap: 15px; }
  .nav-links a { font-size: 12px; }
  .hero { height: 420px; margin-bottom: 32px; }
  .hero-content { padding-bottom: 30px; }
  .hero h1 { font-size: 39px; letter-spacing: -1.3px; }
  .hero-description { font-size: 13px; }
  .hero::after {
    background:
      linear-gradient(to right, rgba(12,12,12,.5), transparent),
      linear-gradient(to top, #0c0c0c 0%, rgba(12,12,12,.55) 55%, transparent 100%);
  }
  .featured-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 13px; }
  .movie-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px 11px; }
  .movie-title { font-size: 12px; }
  .section-heading h2 { font-size: 19px; }
  .search-panel { flex-wrap: wrap; }
  .search-box { max-width: none; flex-basis: 100%; }
  .random-button { width: 100%; }
  .section { margin-top: 34px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; }
}
</style>
</head>

<body>
<header>
  <div class="container nav">
    <a href="#" class="logo">movium<span>.</span></a>
    <nav class="nav-links">
      <a href="#featured">Featured</a>
      <a href="#library">Movies</a>
    </nav>
  </div>
</header>

<main>
  <section class="container hero">
    <img class="hero-backdrop" id="heroBackdrop" alt="">
    <div class="hero-content">
      <div class="eyebrow">FEATURED FILM</div>
      <h1 id="heroTitle">Interstellar</h1>
      <div class="hero-meta" id="heroMeta">2014 · Sci-Fi</div>
      <p class="hero-description" id="heroDescription">
        A journey beyond the stars.
      </p>
      <div class="hero-actions">
        <button class="play-button" id="heroPlay">▶ Play trailer</button>
        <button class="secondary-button" id="heroDetails">More info</button>
      </div>
    </div>
  </section>

  <div class="container">
    <section class="section" id="featured">
      <div class="section-heading">
        <div>
          <h2>Featured films</h2>
          <p class="section-description">A selection worth your time.</p>
        </div>
      </div>
      <div class="featured-grid" id="featuredGrid"></div>
    </section>

    <section class="section" id="library">
      <div class="section-heading">
        <div>
          <h2 id="libraryTitle">Explore movies</h2>
          <p class="section-description">Find your next movie.</p>
        </div>
        <span class="count" id="resultsCount"></span>
      </div>

      <div class="search-panel">
        <label class="search-box">
          <span class="search-symbol">⌕</span>
          <input id="search" type="search"
            placeholder="Search movies..."
            autocomplete="off">
        </label>
        <button class="random-button" id="randomButton">
          ↗ Random movie
        </button>
      </div>

      <div class="alphabet" id="alphabet"></div>
      <div class="movie-grid" id="movieGrid"></div>
    </section>
  </div>
</main>

<footer>
  <div class="container">movium. · A library for movie lovers.</div>
</footer>

<div class="movie-overlay" id="movieOverlay"
  role="dialog" aria-modal="true" aria-labelledby="driveMovieTitle">
  <button class="overlay-close" id="movieOverlayClose"
    aria-label="Close movie">×</button>

  <div class="drive-popup">
    <div class="drive-label">MOVIUM / NOW PLAYING</div>
    <h2 id="driveMovieTitle">Movie title</h2>
    <div class="drive-year" id="driveMovieYear"></div>

    <a class="drive-link" id="driveMovieLink"
      href="#" target="_blank" rel="noopener noreferrer" hidden>
      Open movie ↗
    </a>

    <div class="drive-unavailable" id="driveUnavailable">
      Movie unavailable
    </div>
  </div>
</div>

  trailer: YouTube trailer video ID, or "" if unknown

  Movie posters use TMDB's image CDN. This starter contains
  a sample collection. TMDB API integration can expand it.
*/

  {title:"Everything Everywhere All at Once",year:2022,id:545611,poster:"/w3LxiVYdWWRvEVdn5RYq6jIqkb1.jpg",backdrop:"/ss0Os3uWJfQAENILHZUdX8Tt1OC.jpg",drive:""},
  {title:"Fight Club",year:1999,id:550,poster:"/pB8BM7pdSp6B6Ih7QZ4DrQ3PmJK.jpg",backdrop:"/hZkgoQYus5vegHoetLkCJzb17zJ.jpg",drive:""},
  {title:"Frozen",year:2013,id:109445,poster:"/kgwjIb2JDHRhNk13lmSxiClFjVk.jpg",backdrop:"/bHarw8xrmQeqf3t8HpuMY7zoK4x.jpg",drive:""},
  {title:"Gladiator",year:2000,id:98,poster:"/ty8TGRuvJLPUmAR1H1nRIsgwvim.jpg",backdrop:"/hND7xAaxxBgaIspp9iMsaEXOSTz.jpg",drive:""},
  {title:"Harry Potter and the Philosopher's Stone",year:2001,id:671,poster:"/wuMc08IPKEatf9rnMNXvIDxqP4W.jpg",backdrop:"/hziiv14OpD73u9gAak4XDDfBKa2.jpg",drive:""},
  {title:"Inception",year:2010,id:27205,poster:"/oYuLEt3zVCKq57qu2F8dT7NIa6f.jpg",backdrop:"/s3TBrRGB1iav7gFOCNx3H31MoES.jpg",drive:""},
  {title:"Interstellar",year:2014,id:157336,poster:"/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg",backdrop:"/xJHokMbljvjADYdit5fK5VQsXEG.jpg",drive:"",trailer:"zSWdZVtXT7E",description:"A journey beyond the stars. One crew travels through a wormhole to search for a new home for humanity."},

  {title:"La La Land",year:2016,id:313369,poster:"/uDO8zWDhfWwoFdKS4fzkUJt0Rf0.jpg",backdrop:"/qJeU7KM4nT2C1WpOrwPcSDGFUWE.jpg",drive:""},

  {title:"The Matrix",year:1999,id:603,poster:"/f89U3ADr1oiB1s9GkdPOEpXUk5H.jpg",backdrop:"/icmmSD4vTTDKOq2vvdulafOGw93.jpg",drive:""},
  {title:"The Shawshank Redemption",year:1994,id:278,poster:"/9cjIGR8ymT8ePNF9Tn4DkD6.jpg",backdrop:"/kXfqcdQKsToO0OUXHcrrNCHDBzO.jpg",drive:""},

  {title:"WALL-E",year:2008,id:10681,poster:"/hbhFnRzzg6ZDmm8YAmxBnQpQIPh.jpg",backdrop:"",drive:""},
  {title:"Whiplash",year:2014,id:244786,poster:"/7fn624j5lj3xTme2SgiLCeuedmO.jpg",backdrop:"/6bbZ6XyvgfjhQwbplnUh1LSj1ky.jpg",drive:""},
  {title:"Your Name",year:2016,id:372058,poster:"/q719jXXEzOoYaps6babgKnONONX.jpg",backdrop:"/8GJsy7w7frGquw1cy9jasog7p2Z.jpg",drive:""},
  {title:"Zootopia",year:2016,id:269149,poster:"/hlK0e0wAQ3VLuJcsfIYPvb4JVud.jpg",backdrop:"/mhdeE1yShHTaDbJVdWyTlzFvNkr.jpg",drive:""}
];

const featuredTitles = [
  "Interstellar",
  "The Batman",
  "Oppenheimer",
  "Inception",
  "Spider-Man: No Way Home"
];

const letters = ["All", ..."ABCDEFGHIJKLMNOPQRSTUVWXYZ"];
const $ = id => document.getElementById(id);
let selectedLetter = "All";
let currentMovie = null;

function posterURL(movie) {
  return movie.poster
    ? IMAGE + POSTER_SIZE + movie.poster
    : `https://placehold.co/500x750/171717/ffffff?text=${encodeURIComponent(movie.title)}`;
}

function backdropURL(movie) {
  return movie.backdrop ? IMAGE + BACKDROP_SIZE + movie.backdrop : "";
}

function makeCard(movie) {
  const card = document.createElement("article");
  card.className = "movie";
  card.tabIndex = 0;
  card.setAttribute("role", "button");
  card.setAttribute("aria-label", `${movie.title}, ${movie.year}`);

  const wrap = document.createElement("div");
  wrap.className = "poster-wrap";

  const img = document.createElement("img");
  img.className = "poster";
  img.src = posterURL(movie);
  img.alt = `${movie.title} poster`;
  img.loading = "lazy";
  img.onerror = () => {
    img.onerror = null;
    img.src = `https://placehold.co/500x750/171717/ffffff?text=${encodeURIComponent(movie.title)}`;
  };

  const title = document.createElement("div");
  title.className = "movie-title";
  title.textContent = movie.title;

  const year = document.createElement("div");
  year.className = "movie-year";
  year.textContent = movie.year;

  wrap.appendChild(img);
  card.append(wrap, title, year);

  card.addEventListener("click", () => openMovie(movie));
  card.addEventListener("keydown", event => {
    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      openMovie(movie);
    }
  });

  return card;
}

function renderFeatured() {
  $("featuredGrid").replaceChildren();

  featuredTitles.forEach(title => {
    const movie = movies.find(item => item.title === title);
    if (movie) $("featuredGrid").appendChild(makeCard(movie));
  });
}

function renderAlphabet() {
  $("alphabet").replaceChildren();

  letters.forEach(letter => {
    const button = document.createElement("button");
    button.className = "letter" +
      (selectedLetter === letter ? " active" : "");
    button.textContent = letter;
    button.setAttribute("aria-pressed", selectedLetter === letter);

    button.addEventListener("click", () => {
      selectedLetter = letter;
      renderAlphabet();
      renderMovies();
    });

    $("alphabet").appendChild(button);
  });
}

function renderMovies() {
  const query = $("search").value.trim().toLowerCase();

  const filtered = movies
    .filter(movie => movie.title.toLowerCase().includes(query))
    .filter(movie => selectedLetter === "All" ||
      movie.title.toUpperCase().startsWith(selectedLetter))
    .sort((a, b) => a.title.localeCompare(b.title));

  $("movieGrid").replaceChildren();

  $("libraryTitle").textContent = query
    ? "Search results"
    : selectedLetter === "All"
      ? "Explore movies"
      : `Movies starting with ${selectedLetter}`;

  $("resultsCount").textContent = `${filtered.length} movies`;

  if (!filtered.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "No movies found. Try another search.";
    $("movieGrid").appendChild(empty);
    return;
  }

  filtered.forEach(movie => {
    $("movieGrid").appendChild(makeCard(movie));
  });
}

function setHero(movie) {
  currentMovie = movie;
  $("heroTitle").textContent = movie.title;
  $("heroMeta").textContent = `${movie.year} · Featured film`;
  $("heroDescription").textContent = movie.description ||
    `Discover ${movie.title}, released in ${movie.year}.`;

  const backdrop = $("heroBackdrop");
  const url = backdropURL(movie);

  if (url) {
    backdrop.style.display = "block";
    backdrop.src = url;
    backdrop.onerror = () => {
      backdrop.onerror = null;
      backdrop.style.display = "none";
    };
  } else {
    backdrop.removeAttribute("src");
    backdrop.style.display = "none";
  }
}

function openMovie(movie) {
  currentMovie = movie;

  $("driveMovieTitle").textContent = movie.title;
  $("driveMovieYear").textContent = `Released in ${movie.year}`;

  const link = $("driveMovieLink");
  const unavailable = $("driveUnavailable");

  if (movie.drive && /^https:\/\/drive\.google\.com\//i.test(movie.drive)) {
    link.href = movie.drive;
    link.hidden = false;
    unavailable.hidden = true;
  } else {
    link.removeAttribute("href");
    link.hidden = true;
    unavailable.hidden = false;
    unavailable.textContent = "Movie unavailable";
  }

  $("movieOverlay").classList.add("open");
  document.body.classList.add("overlay-active");
  $("movieOverlayClose").focus();
}

function closeMovie() {
  $("movieOverlay").classList.remove("open");
  document.body.classList.remove("overlay-active");
}

function playTrailer(movie) {
  if (!movie) return;

  const query = encodeURIComponent(
    `${movie.title} ${movie.year} official trailer`
  );

  window.open(
    `https://www.youtube.com/results?search_query=${query}`,
    "_blank",
    "noopener,noreferrer"
  );
}

$("search").addEventListener("input", () => {
  selectedLetter = "All";
  renderAlphabet();
  renderMovies();
});

$("randomButton").addEventListener("click", () => {
  const query = $("search").value.trim().toLowerCase();

  const candidates = movies.filter(movie =>
    movie.title.toLowerCase().includes(query) &&
    (selectedLetter === "All" ||
      movie.title.toUpperCase().startsWith(selectedLetter))
  );

  if (!candidates.length) return;

  const movie = candidates[Math.floor(Math.random() * candidates.length)];
  openMovie(movie);
});

$("heroPlay").addEventListener("click", () => playTrailer(currentMovie));
$("heroDetails").addEventListener("click", () => openMovie(currentMovie));

$("movieOverlayClose").addEventListener("click", closeMovie);

$("movieOverlay").addEventListener("click", event => {
  if (event.target === $("movieOverlay")) closeMovie();
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape") closeMovie();
});

renderAlphabet();
renderFeatured();
renderMovies();
setHero(movies.find(movie => movie.title === "Interstellar"));
</script>
</body>
</html>
