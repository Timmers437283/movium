
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Movium</title>

<style>
:root {
  --bg: #0c0c0c;
  --panel: #151515;
  --border: #292929;
  --text: #f5f5f5;
  --muted: #929292;
  --blue: #0a84ff;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  margin: 0;
  color: var(--text);
  background: var(--bg);
  font-family: Arial, Helvetica, sans-serif;
  -webkit-font-smoothing: antialiased;
}

body.player-open { overflow: hidden; }
button, input { font: inherit; }
button { cursor: pointer; }

button:focus-visible,
a:focus-visible,
input:focus-visible {
  outline: 2px solid white;
  outline-offset: 3px;
}

header {
  position: sticky;
  top: 0;
  z-index: 20;
  background: #0c0c0c;
  border-bottom: 1px solid #202020;
}

.nav {
  min-height: 68px;
  display: grid;
  grid-template-columns: 1fr minmax(220px, 520px) 1fr;
  align-items: center;
  gap: 24px;
  width: min(1500px, calc(100% - 48px));
  margin: auto;
}

.logo {
  justify-self: start;
  color: white;
  font-size: 27px;
  font-weight: 800;
  letter-spacing: -1.5px;
  text-decoration: none;
}

.logo span { color: #888; }

.search-wrap {
  width: 100%;
  height: 41px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 13px;
  background: #171717;
  border: 1px solid #303030;
  border-radius: 5px;
}

.search-wrap svg {
  width: 18px;
  height: 18px;
  color: #929292;
  flex-shrink: 0;
}

#search {
  width: 100%;
  border: 0;
  outline: none;
  background: transparent;
  color: white;
  font-size: 13px;
}

#search::placeholder { color: #888; }

.nav-right {
  justify-self: end;
  color: #aaa;
  font-size: 12px;
  white-space: nowrap;
}

main {
  width: min(1500px, calc(100% - 48px));
  margin: auto;
  padding-bottom: 65px;
}

.hero {
  height: clamp(370px, 43vw, 570px);
  position: relative;
  display: flex;
  align-items: flex-end;
  margin-bottom: 38px;
  overflow: hidden;
  isolation: isolate;
}

.hero-backdrop {
  position: absolute;
  z-index: -2;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 35%;
  background: #111;
}

.hero::after {
  content: "";
  position: absolute;
  z-index: -1;
  inset: 0;
  background:
    linear-gradient(0deg, #0c0c0c 0%, rgba(12,12,12,.8) 13%, transparent 70%),
    linear-gradient(90deg, rgba(12,12,12,.9), rgba(12,12,12,.35) 45%, transparent 85%);
}

.hero-content {
  max-width: 580px;
  padding: 0 0 46px 6px;
}

.eyebrow {
  color: #c7c7c7;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 2px;
  margin-bottom: 13px;
}

.hero h1 {
  margin: 0;
  font-size: clamp(38px, 5vw, 66px);
  letter-spacing: -2px;
  line-height: 1.03;
}

.hero-meta {
  margin-top: 13px;
  color: #ddd;
  font-size: 13px;
}

.hero-description {
  color: #ccc;
  max-width: 460px;
  font-size: 14px;
  line-height: 1.7;
  margin: 14px 0 21px;
}

.hero-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.primary-btn, .secondary-btn {
  border-radius: 5px;
  padding: 12px 18px;
  font-size: 13px;
  font-weight: 700;
}

.primary-btn {
  color: #111;
  background: #fff;
  border: 1px solid #fff;
}

.primary-btn:hover { background: #ddd; }

.secondary-btn {
  color: #fff;
  background: #222;
  border: 1px solid #444;
}

.secondary-btn:hover { background: #333; }

.section {
  margin-top: 40px;
  scroll-margin-top: 85px;
}

.section-head {
  display: flex;
  justify-content: space-between;
  align-items: end;
  gap: 12px;
  margin-bottom: 17px;
}

.section-head h2 {
  margin: 0;
  font-size: 21px;
  letter-spacing: -.5px;
}

.section-subtitle {
  margin: 6px 0 0;
  color: var(--muted);
  font-size: 12px;
}

.section-count {
  color: #888;
  font-size: 12px;
  white-space: nowrap;
}

.movie-row {
  display: grid;
  grid-auto-columns: minmax(145px, 190px);
  grid-auto-flow: column;
  gap: 16px;
  overflow-x: auto;
  padding: 2px 2px 12px;
  scrollbar-width: thin;
  scrollbar-color: #383838 transparent;
}

.movie-row::-webkit-scrollbar { height: 5px; }
.movie-row::-webkit-scrollbar-thumb {
  background: #383838;
  border-radius: 4px;
}

.movie-card {
  min-width: 0;
  cursor: pointer;
  outline-offset: 3px;
}

.poster-wrap {
  position: relative;
  aspect-ratio: 2 / 3;
  overflow: hidden;
  border-radius: 4px;
  border: 1px solid #282828;
  background: #181818;
}

.poster {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform .2s ease, opacity .2s ease;
}

.movie-card:hover .poster {
  transform: scale(1.04);
  opacity: .84;
}

.poster-fallback {
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 12px;
  color: #ddd;
  font-weight: 700;
  font-size: 16px;
  line-height: 1.4;
  height: 100%;
}

.movie-title {
  margin-top: 9px;
  font-size: 13px;
  line-height: 1.45;
  font-weight: 600;
}

.movie-year {
  margin-top: 4px;
  color: #929292;
  font-size: 12px;
}

.empty {
  color: #999;
  padding: 40px 0;
  font-size: 14px;
}

footer {
  border-top: 1px solid #222;
  padding: 24px;
  color: #777;
  font-size: 12px;
  text-align: center;
}

.player-overlay {
  position: fixed;
  z-index: 100;
  inset: 0;
  display: none;
  overflow-y: auto;
  background: #000;
  color: white;
}

.player-overlay.open { display: block; }

.player-topbar {
  height: 58px;
  padding: 0 22px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  background: #000;
}

.player-brand {
  font-weight: 800;
  letter-spacing: -1px;
  font-size: 21px;
}

.player-controls {
  display: flex;
  align-items: center;
  gap: 9px;
}

.player-control {
  border: 1px solid #393939;
  color: #eee;
  background: #141414;
  padding: 9px 12px;
  border-radius: 4px;
  font-size: 12px;
}

.player-control:hover { background: #292929; }

.player-control.close {
  width: 37px;
  height: 37px;
  padding: 0;
  font-size: 25px;
}

.player-stage {
  position: relative;
  width: 100%;
  height: min(76vh, 1000px);
  min-height: 260px;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
}

.player-stage iframe,
.player-stage video {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
  background: #000;
}

.player-message {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 24px;
  color: #aaa;
  background: #000;
  font-size: 14px;
  line-height: 1.7;
  pointer-events: none;
}

.player-message.hidden { display: none; }

.player-info {
  width: min(1100px, calc(100% - 40px));
  margin: 0 auto;
  padding: 27px 0 55px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(200px, 320px);
  gap: 35px;
}

.player-info h1 {
  margin: 0;
  font-size: clamp(27px, 4vw, 42px);
  letter-spacing: -1px;
}

.detail-meta {
  margin-top: 10px;
  color: #aaa;
  font-size: 13px;
}

.detail-story {
  margin-top: 18px;
  color: #ccc;
  font-size: 14px;
  line-height: 1.8;
}

.detail-label {
  margin-top: 21px;
  color: #888;
  font-size: 11px;
  letter-spacing: 1px;
  text-transform: uppercase;
}

.detail-cast {
  margin-top: 7px;
  color: #ddd;
  font-size: 13px;
  line-height: 1.7;
}

.detail-poster {
  width: 100%;
  max-width: 230px;
  aspect-ratio: 2 / 3;
  object-fit: cover;
  border: 1px solid #222;
  border-radius: 4px;
  background: #151515;
}

.player-note {
  color: #777;
  font-size: 11px;
  line-height: 1.6;
  margin-top: 20px;
}

@media (min-width: 1100px) {
  .movie-row {
    grid-auto-columns: minmax(160px, 205px);
    gap: 19px;
  }
}

@media (max-width: 650px) {
  .nav {
    width: calc(100% - 28px);
    min-height: 112px;
    grid-template-columns: 1fr auto;
    grid-template-rows: 49px 49px;
    gap: 0 12px;
    padding-bottom: 8px;
  }

  .logo { font-size: 24px; }
  .nav-right { font-size: 11px; }

  .search-wrap {
    grid-column: 1 / -1;
    grid-row: 2;
    height: 39px;
  }

  main { width: calc(100% - 28px); }
  .hero { height: 430px; }
  .hero-content { padding-bottom: 30px; }
  .hero h1 { font-size: 39px; }
  .hero-description { font-size: 13px; }

  .hero::after {
    background:
      linear-gradient(0deg, #0c0c0c, rgba(12,12,12,.35) 75%, transparent),
      linear-gradient(90deg, rgba(12,12,12,.55), transparent);
  }

  .movie-row {
    grid-auto-columns: minmax(125px, 41vw);
    gap: 12px;
  }

  .section { margin-top: 31px; }
  .section-head h2 { font-size: 19px; }
  .player-topbar { padding: 0 12px; }
  .player-brand { font-size: 18px; }
  .player-control { padding: 8px 9px; }

  .player-stage {
    height: 56.25vw;
    min-height: 210px;
    max-height: 70vh;
  }

  .player-info {
    width: calc(100% - 28px);
    grid-template-columns: 1fr;
    gap: 20px;
    padding-top: 22px;
  }

  .detail-poster { max-width: 145px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; }
}
</style>
</head>

const $ = id => document.getElementById(id);
let currentMovie = movies.find(movie => movie.title === "Interstellar") || movies[0];

/*
  CUSTOM POSTER URL SUPPORT

  Paste any direct image URL into customPoster for a movie.

  Example:
  customPoster: "https://example.com/poster.jpg"

  A direct image URL is required. A link to an IMDb movie page
  or another webpage is not itself an image URL.
*/
function posterURL(movie) {
  const customURL = (movie.customPoster || "").trim();

  if (customURL) {
    return customURL;
  }

  return movie.poster
    ? TMDB + "w500" + movie.poster
    : "";
}

function backdropURL(movie) {
  return movie.backdrop
    ? TMDB + "w1280" + movie.backdrop
    : posterURL(movie);
}

function setText(id, value) {
  $(id).textContent = value || "";
}

function addPosterFallback(wrap, movie) {
  if (wrap.querySelector(".poster-fallback")) return;

  const fallback = document.createElement("div");
  fallback.className = "poster-fallback";
  fallback.textContent = movie.title;
  wrap.appendChild(fallback);
}

function createCard(movie) {
  const card = document.createElement("article");
  card.className = "movie-card";
  card.tabIndex = 0;
  card.setAttribute("role", "button");
  card.setAttribute("aria-label", `Open ${movie.title}`);

  const wrap = document.createElement("div");
  wrap.className = "poster-wrap";

  const imageURL = posterURL(movie);

  if (imageURL) {
    const image = document.createElement("img");
    image.className = "poster";
    image.src = imageURL;
    image.alt = `${movie.title} poster`;
    image.loading = "lazy";
    image.referrerPolicy = "no-referrer";

    image.onerror = () => {
      image.remove();
      addPosterFallback(wrap, movie);
    };

    wrap.appendChild(image);
  } else {
    addPosterFallback(wrap, movie);
  }

  const title = document.createElement("div");
  title.className = "movie-title";
  title.textContent = movie.title;

  const year = document.createElement("div");
  year.className = "movie-year";
  year.textContent = movie.year;

  card.append(wrap, title, year);
  card.addEventListener("click", () => openMovie(movie));

  card.addEventListener("keydown", event => {
    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      openMovie(movie);
    }
  });

  return card;
}

function renderCollections() {
  const root = $("collections");
  root.replaceChildren();

  collections.forEach(collection => {
    const section = document.createElement("section");
    section.className = "section";

    const heading = document.createElement("div");
    heading.className = "section-head";

    const headingContent = document.createElement("div");
    const title = document.createElement("h2");
    title.textContent = collection.title;

    const subtitle = document.createElement("p");
    subtitle.className = "section-subtitle";
    subtitle.textContent = collection.subtitle;

    headingContent.append(title, subtitle);
    heading.appendChild(headingContent);

    const row = document.createElement("div");
    row.className = "movie-row";

    const list = collection.category === "All"
      ? [...movies].sort((a, b) => a.title.localeCompare(b.title))
      : movies.filter(movie => movie.category.includes(collection.category));

    list.forEach(movie => row.appendChild(createCard(movie)));

    if (!list.length) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "More movies coming soon.";
      row.appendChild(empty);
    }

    section.append(heading, row);
    root.appendChild(section);
  });
}

function setHero(movie) {
  currentMovie = movie;
  setText("heroTitle", movie.title);
  setText("heroMeta", `${movie.year} · ${movie.category[0] || "Movie"}`);
  setText("heroDescription", movie.story);

  const backdrop = $("heroBackdrop");
  const url = backdropURL(movie);

  backdrop.onerror = null;

  if (url) {
    backdrop.src = url;
    backdrop.style.display = "block";
    backdrop.onerror = () => {
      backdrop.style.display = "none";
    };
  } else {
    backdrop.removeAttribute("src");
    backdrop.style.display = "none";
  }
}

function openMovie(movie) {
  currentMovie = movie;

  setText("detailTitle", movie.title);
  setText("detailMeta", `${movie.year} · ${movie.category.join(" · ")}`);
  setText("detailStory", movie.story);
  setText("detailCast", movie.cast);

  const poster = $("detailPoster");
  poster.onerror = null;

  const imageURL = posterURL(movie);

  if (imageURL) {
    poster.src = imageURL;
    poster.style.display = "block";
    poster.onerror = () => {
      poster.removeAttribute("src");
      poster.style.display = "none";
    };
  } else {
    poster.removeAttribute("src");
    poster.style.display = "none";
  }

  const stage = $("playerStage");
  stage.replaceChildren();

  const message = document.createElement("div");
  message.className = "player-message";
  message.id = "playerMessage";

  const driveURL = movie.drive || "";
  const driveMatch = driveURL.match(
    /drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/
  );

  if (driveMatch) {
    const iframe = document.createElement("iframe");
    iframe.src = `https://drive.google.com/file/d/${driveMatch[1]}/preview`;
    iframe.title = `${movie.title} video player`;
    iframe.allow = "autoplay; encrypted-media; fullscreen; picture-in-picture";
    iframe.allowFullscreen = true;
    iframe.referrerPolicy = "strict-origin-when-cross-origin";
    stage.appendChild(iframe);

    message.textContent = "If playback doesn't load, check the video's sharing settings.";
  } else if (
    /^https?:\/\//i.test(driveURL) &&
    /\.(mp4|webm|ogg)(\?.*)?$/i.test(driveURL)
  ) {
    const video = document.createElement("video");
    video.src = driveURL;
    video.controls = true;
    video.autoplay = false;
    video.playsInline = true;
    video.preload = "metadata";
    video.id = "nativeVideo";
    stage.appendChild(video);
  } else {
    message.textContent = "No playable video is configured for this title yet.";
  }

  stage.appendChild(message);

  const nativeVideo = $("nativeVideo");

  if (nativeVideo) {
    nativeVideo.addEventListener("loadedmetadata", () => {
      message.classList.add("hidden");
    });

    nativeVideo.addEventListener("error", () => {
      message.textContent = "This video could not be loaded. Check the URL and permissions.";
      message.classList.remove("hidden");
    });
  } else if (driveMatch) {
    message.textContent = "";
    message.classList.add("hidden");
  }

  $("playerOverlay").classList.add("open");
  $("playerOverlay").setAttribute("aria-hidden", "false");
  document.body.classList.add("player-open");

  updatePipButton();
}

function closePlayer() {
  $("playerOverlay").classList.remove("open");
  $("playerOverlay").setAttribute("aria-hidden", "true");
  document.body.classList.remove("player-open");

  $("playerStage").replaceChildren();
  $("pipButton").hidden = true;
}

function updatePipButton() {
  const video = $("nativeVideo");
  const pip = $("pipButton");

  pip.hidden = !(
    video &&
    document.pictureInPictureEnabled &&
    !video.disablePictureInPicture
  );
}

$("pipButton").addEventListener("click", async () => {
  const video = $("nativeVideo");
  if (!video) return;

  try {
    if (document.pictureInPictureElement) {
      await document.exitPictureInPicture();
    } else if (document.pictureInPictureEnabled) {
      await video.requestPictureInPicture();
    }
  } catch (error) {
    console.error("Picture-in-Picture unavailable:", error);
  }
});

$("heroPlay").addEventListener("click", () => openMovie(currentMovie));
$("heroInfo").addEventListener("click", () => openMovie(currentMovie));
$("closePlayer").addEventListener("click", closePlayer);

document.addEventListener("keydown", event => {
  if (event.key === "Escape") closePlayer();
});

$("search").addEventListener("input", () => {
  const query = $("search").value.trim().toLowerCase();
  const resultsSection = $("searchResults");
  const resultsRow = $("resultRow");

  resultsRow.replaceChildren();

  if (!query) {
    resultsSection.hidden = true;
    $("collections").style.display = "";
    return;
  }

  $("collections").style.display = "none";
  resultsSection.hidden = false;

  const results = movies.filter(movie =>
    movie.title.toLowerCase().includes(query) ||
    movie.category.some(category => category.toLowerCase().includes(query)) ||
    movie.cast.toLowerCase().includes(query)
  );

  setText(
    "resultCount",
    `${results.length} ${results.length === 1 ? "movie" : "movies"}`
  );

  if (!results.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "No movies found. Try another search.";
    resultsRow.appendChild(empty);
    return;
  }

  results.forEach(movie => resultsRow.appendChild(createCard(movie)));
});

renderCollections();
setHero(currentMovie);
</script>
</body>
</html>
